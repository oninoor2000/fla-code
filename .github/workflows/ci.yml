name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm create /tmp/fla-code-ci-app --yes
      - run: pnpm --dir /tmp/fla-code-ci-app install
      - run: pnpm --dir /tmp/fla-code-ci-app lint
      - run: pnpm --dir /tmp/fla-code-ci-app typecheck
      - run: pnpm --dir /tmp/fla-code-ci-app build
